<svg width="25" height="25" viewBox="0 0 25 25" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="25" height="25" fill="#f9f9f9"/>
  
  <!-- Switch Track (Horizontal) -->
  <rect x="0" y="2" width="25" height="10" rx="4.5" fill="#e5e5ea"/> <!-- e5e5ea -->
  
  <!-- Switch Knob (On Position - Right) -->
  <circle cx="20" cy="7" r="4.5" fill="#8BBDE0" stroke="#007cba" stroke-width="0.5"/>
  
  <!-- Text Label -->
  <text x="25.5" y="23" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="end">Phys</text>
  
  <!-- Optional "Off" indicator (small circle on left) -->
  <circle cx="5" cy="7" r="1" fill="#ccc"/>
</svg>