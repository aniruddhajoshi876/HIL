    </g>
  </defs>

  <!-- Back copy: 6 px up-left -->
  <g transform="translate(-1.5875 -1.5875)">
    <g transform="matrix(0.12312322 0 0 0.14871034 -0.82061392 -0.91825)">
      <use href="#letter-symbol" />
    </g>
  </g>

  <!-- Middle copy: 3 px up-left -->
  <g transform="translate(-0.79375 -0.79375)">
    <g transform="matrix(0.12312322 0 0 0.14871034 -0.82061392 -0.91825)">
      <use href="#letter-symbol" />
    </g>
  </g>

  <!-- Original letter symbol, drawn last so it is visually in front -->
  <g transform="matrix(0.12312322 0 0 0.14871034 -0.82061392 -0.91825)">
    <use href="#letter-symbol" />
  </g>

</svg>